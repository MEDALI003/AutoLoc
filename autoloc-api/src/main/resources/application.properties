spring.application.name=autoloc-api

# 8080 est occupé par le listener Oracle XE sur ce poste
server.port=${SERVER_PORT:8081}

# Connexion à la base de données (mot de passe fourni par variable d'environnement DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
