# Profil "dev" : activer avec -Dspring.profiles.active=dev
# (IntelliJ : Run > Edit Configurations > Active profiles = dev)

# Base de developpement separee
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_dev_db?createDatabaseIfNotExist=true

# Logs plus verbeux en dev
logging.level.tn.esprit.autoloc=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Insertion des vehicules de demonstration au demarrage
autoloc.demo-data.enabled=true
